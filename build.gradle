plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

subprojects { sub ->
    if (sub.path.startsWith(':versions:')) {
        sub.apply from: rootProject.file('gradle/version-conventions.gradle')
    }
}

def distDir = layout.buildDirectory.dir('dist')

tasks.register('copyLatestJar', Copy) {
    dependsOn ":versions:${latest_mc_version}:build"
    from project(":versions:${latest_mc_version}").layout.buildDirectory.dir('libs')
    include '*.jar'
    into layout.buildDirectory.dir('libs')
}

tasks.named('build') {
    dependsOn ':core:check', 'copyLatestJar'
}

tasks.register('buildLegacy') {
    group = 'build'
    description = 'Builds Legacy Fabric artifacts (MC 1.12.2 - 1.13.2) via isolated legacy build.'
    onlyIf { file('legacy/settings.gradle').exists() }
    doLast {
        def gradlewCmd = System.getProperty('os.name').toLowerCase().contains('windows')
                ? ['cmd', '/c', rootProject.file('gradlew.bat').absolutePath]
                : [rootProject.file('gradlew').absolutePath]
        def proc = new ProcessBuilder(gradlewCmd + ['--project-dir', rootProject.file('legacy').absolutePath, 'build'])
                .inheritIO()
                .start()
        int code = proc.waitFor()
        if (code != 0) {
            throw new GradleException("Legacy Fabric build failed with exit code ${code}")
        }
    }
}

tasks.register('buildAll', Copy) {
    group = 'build'
    description = 'Runs core tests and builds every supported Minecraft version into build/dist.'
    dependsOn ':core:check'
    dependsOn 'buildLegacy'
    subprojects.findAll { it.path.startsWith(':versions:') }.each { verProj ->
        dependsOn "${verProj.path}:build"
        from verProj.layout.buildDirectory.dir('libs')
    }
    from('legacy/build/dist') {
        include '*.jar'
    }
    include '*.jar'
    exclude '*-dev.jar', '*-sources.jar'
    into distDir
}
