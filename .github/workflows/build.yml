name: Build & Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core tests and build latest (MC 26.3)
        run: ./gradlew build

      - name: Build all supported Minecraft versions
        run: ./gradlew buildAll --no-parallel

      - name: Upload built mod jars
        uses: actions/upload-artifact@v4
        with:
          name: sharpness6-all-versions
          path: build/dist/*.jar
          if-no-files-found: error
