name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core unit tests
        run: ./gradlew :core:test

      - name: Build all supported Minecraft versions
        run: ./gradlew buildAll --no-parallel

      - name: Verify expected jar count
        run: |
          count=$(ls build/dist/*.jar | wc -l)
          echo "Built $count jars"
          if [ "$count" -ne 19 ]; then
            echo "Expected 19 jars, found $count" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true