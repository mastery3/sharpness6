name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag points to an approved branch
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main && \
             ! git merge-base --is-ancestor "$GITHUB_SHA" origin/1.21; then
            echo "Tag commit is not reachable from main or 1.21" >&2
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core unit tests
        run: ./gradlew :core:test

      - name: Build all supported Minecraft versions
        run: ./gradlew buildAll --no-parallel

      - name: Verify one artifact per expected Minecraft version
        run: python3 scripts/verify-version-ranges.py build/dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true